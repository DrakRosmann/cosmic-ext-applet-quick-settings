[package]
name = "cosmic-ext-applet-quick-settings"
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-only"
description = "Quick settings applet for the COSMIC panel, like the macOS Control Center"

[dependencies]
cosmic-settings-a11y-manager-subscription = { git = "https://github.com/pop-os/cosmic-settings", rev = "ae5c750" }
cosmic-settings-accessibility-subscription = { git = "https://github.com/pop-os/cosmic-settings", rev = "ae5c750" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = [
    "applet",
    "dbus-config",
    "multi-window",
    "tokio",
    "wayland",
    "winit",
] }
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
zbus = { version = "5.14.0", default-features = false, features = ["tokio", "p2p"] }

[profile.release]
opt-level = 3
panic = "abort"
lto = "thin"

# Same pins as cosmic-applets epoch-1.8.0, to match the installed panel.
[patch."https://github.com/smithay/client-toolkit.git"]
sctk = { package = "smithay-client-toolkit", version = "0.20.0" }

[patch."https://github.com/pop-os/cosmic-protocols"]
cosmic-protocols = { git = "https://github.com/pop-os/cosmic-protocols//", rev = "32283d7" }
cosmic-client-toolkit = { git = "https://github.com/pop-os/cosmic-protocols//", rev = "32283d7" }
